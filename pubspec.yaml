name: puranika_sadana
description: "Puranika Sadana - Enterprise Wedding Hall Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  pdf: ^3.12.0
  printing: ^5.13.2
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.9.0+3
  timezone: ^0.9.4
  path_provider: ^2.1.3
  google_mlkit_text_recognition: ^0.14.0
  encrypt: ^5.0.3
  image: ^4.2.0
  share_plus: ^10.1.2
  url_launcher: ^6.2.5
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icon/app_icon.png

  fonts:
  - family: NotoSansKannada
    fonts:
      - asset: assets/fonts/NotoSansKannada-Regular.ttf

  - family: NotoSans
    fonts:
      - asset: assets/fonts/NotoSans-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#06144D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
